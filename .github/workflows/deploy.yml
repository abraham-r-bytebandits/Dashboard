name: Deploy Vite App to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout code
        uses: actions/checkout@v4

      - name: 2. Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 3. Install dependencies
        run: npm ci

      - name: 4. Build project
        run: npm run build

      - name: Copy dist to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: "abc-testig.duckdns.org"
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "dist/*"
          target: "/home/ec2-user/"

      - name: 6. Deploy to Nginx
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: "abc-testig.duckdns.org"
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo rm -rf /usr/share/nginx/html/*
            sudo cp -r /home/ec2-user/dist/* /usr/share/nginx/html/
            
            echo "=== AUTO CONFIGURING NGINX API PROXY ==="
            sudo python3 << 'EOF'
            import glob, re
            for f in glob.glob('/etc/nginx/conf.d/*.conf'):
                with open(f, 'r') as file:
                    content = file.read()
                if 'abc-testig.duckdns.org' in content and 'listen 443 ssl' in content:
                    if 'location /api' in content:
                        print("Location /api already configured in:", f)
                        continue
                    pattern = r'(location\s+/[\s\S]*?try_files[\s\S]*?})'
                    api_block = """\n\n    location /api {\n        proxy_pass http://localhost:4000;\n        proxy_http_version 1.1;\n        proxy_set_header Upgrade $http_upgrade;\n        proxy_set_header Connection 'upgrade';\n        proxy_set_header Host $host;\n        proxy_set_header X-Real-IP $remote_addr;\n        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n        proxy_set_header X-Forwarded-Proto $scheme;\n    }"""
                    new_content, count = re.subn(pattern, r'\1' + api_block, content, count=1)
                    if count > 0:
                        with open(f, 'w') as file:
                            file.write(new_content)
                        print("Successfully configured API proxy in:", f)
                    else:
                        print("Failed to find location block pattern in:", f)
            EOF
            
            sudo nginx -t
            sudo systemctl restart nginx
