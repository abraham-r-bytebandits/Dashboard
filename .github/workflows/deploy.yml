name: Deploy Vite App to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout code
        uses: actions/checkout@v4

      - name: 2. Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 3. Install dependencies
        run: npm ci

      - name: 4. Build project
        run: npm run build

      - name: Copy dist to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: "abc-testig.duckdns.org"
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "dist/*"
          target: "/home/ec2-user/"

      - name: 6. Deploy to Nginx
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: "abc-testig.duckdns.org"
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "=== FILES IN HOME ==="
            ls -la /home/ec2-user/ || true
            echo "=== PM2 LIST ALL ==="
            pm2 list || sudo pm2 list || true
            echo "=== SYSTEMD SERVICES ==="
            systemctl list-units --type=service | grep -iE 'dash|rimoto|back' || true
