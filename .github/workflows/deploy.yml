name: Deploy Vite App to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout code
        uses: actions/checkout@v4

      - name: 2. Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 3. Install dependencies
        run: npm ci

      - name: 4. Build project
        run: npm run build

      - name: Copy dist to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: "abc-testig.duckdns.org"
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "dist/*"
          target: "/home/ec2-user/"

      - name: 6. Deploy to Nginx
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: "abc-testig.duckdns.org"
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo rm -rf /usr/share/nginx/html/*
            sudo cp -r /home/ec2-user/dist/* /usr/share/nginx/html/
            sudo systemctl restart nginx
            echo "=== RUNNING PROCESSES / PORTS ==="
            sudo ss -tulpn || sudo netstat -tulpn || true
            echo "=== PM2 STATUS ==="
            sudo pm2 status || pm2 list || true
            echo "=== NGINX CONFIGURATION ==="
            sudo cat /etc/nginx/nginx.conf
            echo "=== NGINX SITES CONFIG ==="
            sudo cat /etc/nginx/sites-enabled/* || sudo cat /etc/nginx/conf.d/* || true
